# Minimal Supabase CLI config. Run `supabase link` after installing the CLI.
# Docs: https://supabase.com/docs/guides/cli

project_id = "quy-nuoi-em"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://quynuoiem.com"
additional_redirect_urls = [
  "http://localhost:3000/admin/auth/callback",
  "https://quynuoiem.com/admin/auth/callback",
  "https://www.quynuoiem.com/admin/auth/callback",
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[storage]
enabled = true
