# Minimal Supabase CLI config. Run `supabase link` after installing the CLI.
# Docs: https://supabase.com/docs/guides/cli

project_id = "quy-nuoi-em"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin/auth/callback"]

[storage]
enabled = true
